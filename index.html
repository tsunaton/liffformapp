    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <script>

        $(document).ready(function () {
            const liffId = "1656776753-5ayjAoQQ";
            initializeLiff(liffId);
        })

        function initializeLiff(liffId) {
            liff.init({
                liffId: liffId
            }).then(() => {
                initializeApp();
            }).catch((err) => {
                console.log('LIFF Initialization failed ', err);
            });
        }

        function sendText(text) {
            liff.sendMessages([{
                'type': 'text',
                'text': text
            }]).then(function () {
                liff.closeWindow();
            }).catch(function (error) {
                window.alert('Failed to send message ' + error);
            });
        }

        const params = (new URL(document.location)).searchParams;
        const key = params.get('key');

        $(function () {
            $('form').submit(function () {
                const date = $('input[name="date"]').val();
                const ie = $('input[name="ie"]').val();
                const start_time = $('select[name="start_time"]').val();
                const end_time = $('select[name="end_time"]').val();
                const place = $('input[name="place"]').val();
        
                // 🔽 候補にないチェックがONの場合は固定値を、OFFなら入力値を使う
                const client = $('#clientUnknown').is(':checked') ? '候補になし' : $('select[name="client"]').val();

                const funeral_home = $('input[name="funeral_home"]').val();
                const transportation_fee = $('input[name="transportation_fee"]').val();
                const parking_fee = $('input[name="parking_fee"]').val();
                const memo = $('input[name="memo"]').val();
        
                const msg = `${date}\n${ie}\n${start_time}\n${end_time}\n${place}\n${client}\n${funeral_home}\n${transportation_fee}\n${parking_fee}\n${memo}`;
                sendText(msg);
                return false;
            });
        });


    </script>
    <script>
        $(document).ready(function () {
            // 「クライアント」のチェック状態で選択欄を有効/無効
            $('#clientUnknown').change(function () {
                $('select[name="client"]').prop('disabled', $(this).is(':checked'));
            });
        });
    </script>
    
    <script>
        let previousPlace = '';
        let previousClient = '';
    
        $(document).ready(function () {    
            // 「クライアント」チェック状態で選択欄のON/OFFと値の保持・復元
            $('#clientUnknown').change(function () {
                const $clientSelect = $('select[name="client"]');
                if ($(this).is(':checked')) {
                    previousClient = $clientSelect.val();
                    $clientSelect.val('');                 // 表示を空に
                    $clientSelect.prop('disabled', true);
                } else {
                    $clientSelect.prop('disabled', false);
                    $clientSelect.val(previousClient);
                }
            });
        });
    </script>
