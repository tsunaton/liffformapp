    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <script>

        $(document).ready(function () {
            const liffId = "1656776753-5ayjAoQQ";
            initializeLiff(liffId);
        })

        function initializeLiff(liffId) {
            liff.init({
                liffId: liffId
            }).then(() => {
                initializeApp();
            }).catch((err) => {
                console.log('LIFF Initialization failed ', err);
            });
        }

        function sendText(text) {
            liff.sendMessages([{
                'type': 'text',
                'text': text
            }]).then(function () {
                liff.closeWindow();
            }).catch(function (error) {
                window.alert('Failed to send message ' + error);
            });
        }

        const params = (new URL(document.location)).searchParams;
        const key = params.get('key');

        $(function () {
            $('form').submit(function () {
                const date = $('input[name="date"]').val();
                const ie = $('input[name="ie"]').val();
                const start_time = $('select[name="start_time"]').val();
                const end_time = $('select[name="end_time"]').val();
                const place = $('input[name="place"]').val();

                // 🔽 候補にないチェックがONの場合は固定値を、OFFなら入力値を使う
                const client = $('#clientUnknown').is(':checked') ? '候補になし' : $('select[name="client"]').val();

                const funeral_home = $('input[name="funeral_home"]').val();
                const transportation_fee = $('input[name="transportation_fee"]').val();
                const parking_fee = $('input[name="parking_fee"]').val();
                const memo = $('input[name="memo"]').val();

                const msg = `${date}\n${ie}\n${start_time}\n${end_time}\n${place}\n${client}\n${funeral_home}\n${transportation_fee}\n${parking_fee}\n${memo}`;
                sendText(msg);
                return false;
            });
        });


    </script>

    <script>
        // =====================================================
        // ▼ 場所・葬儀社の候補リスト
        //   name  = 表示・送信される名前
        //   yomi  = ひらがなの読み（ひらがなで打っても候補に出るようにするため）
        //   ※ 候補を増やすときは、この形で1行追加するだけでOKです
        // =====================================================
        const PLACE_LIST = [
            { name: '戸田公園ホール',   yomi: 'とだこうえんほーる' },
            { name: '越谷斎場',         yomi: 'こしがやさいじょう' },
            { name: '埼葛斎場',         yomi: 'さいかつさいじょう' },
            { name: '大宮聖苑',         yomi: 'おおみやせいえん' },
            { name: '浦和斎場',         yomi: 'うらわさいじょう' },
            { name: 'しののめの里',     yomi: 'しののめのさと' },
            { name: 'つつじ苑',         yomi: 'つつじえん' },
            { name: 'メモリアルトネ',   yomi: 'めもりあるとね' },
            { name: '川越斎場',         yomi: 'かわごえさいじょう' },
            { name: '谷塚斎場',         yomi: 'やつかさいじょう' },
            { name: '妙典寺',           yomi: 'みょうでんじ' },
            { name: '三郷斎場',         yomi: 'みさとさいじょう' },
            { name: '北戸田ホール',     yomi: 'きたとだほーる' },
            { name: '所沢斎場',         yomi: 'ところざわさいじょう' },
            { name: 'みずほ斎場',       yomi: 'みずほさいじょう' },
            { name: '浦安斎場',         yomi: 'うらやすさいじょう' },

        const FUNERAL_HOME_LIST = [
            { name: '金宝堂',           yomi: 'きんぽうどう' },
            { name: 'ファミーユ',       yomi: 'ふぁみーゆ' },
            { name: 'むすびす',         yomi: 'むすびす' },
            { name: '熊木式典',         yomi: 'くまきしきてん' },
            { name: '川口市民葬祭',     yomi: 'かわぐちしみんそうさい' },
            { name: '川口典礼',         yomi: 'かわぐちてんれい' },
            { name: '島村葬儀社',       yomi: 'しまむらそうぎしゃ' },
            { name: 'リベント',         yomi: 'りべんと' },
            { name: '井上葬祭',         yomi: 'いのうえそうさい' },
            { name: 'ティア',           yomi: 'てぃあ' },
            { name: 'ひのき葬祭',       yomi: 'ひのきそうさい' },
            { name: 'ヒューマンアシスト', yomi: 'ひゅーまんあしすと' },
            { name: 'だいご',           yomi: 'だいご' },
            { name: 'FLOW',             yomi: 'ふろー' },
            { name: 'フェイス',         yomi: 'ふぇいす' },
            { name: 'おくりびと',       yomi: 'おくりびと' }
        ];

        // 入力された文字をそろえる（カタカナ→ひらがな、全角英数→半角、大文字→小文字）
        function normalize(str) {
            return (str || '')
                .replace(/[ァ-ヶ]/g, function (ch) {
                    return String.fromCharCode(ch.charCodeAt(0) - 0x60);
                })
                .replace(/[Ａ-Ｚａ-ｚ０-９]/g, function (ch) {
                    return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0);
                })
                .toLowerCase()
                .replace(/\s/g, '');
        }

        // 入力欄に「打つたびに候補が出る」機能を付ける
        function setupSuggest(selector, list) {
            const $input = $(selector);

            $input.autocomplete({
                minLength: 0,   // 0文字でも（タップしただけでも）候補を出す
                delay: 0,       // 待たずにすぐ出す
                source: function (request, response) {
                    const q = normalize(request.term);
                    const hits = list.filter(function (item) {
                        if (q === '') return true;  // 空なら全部
                        return normalize(item.name).indexOf(q) !== -1 ||
                               item.yomi.indexOf(q) !== -1;
                    });
                    response(hits.map(function (item) { return item.name; }));
                },
                open: function () {
                    // iPhoneで「2回タップしないと選べない」問題の対策
                    $('.ui-autocomplete').off('menufocus hover mouseover mouseenter');
                }
            });

            // 日本語入力（変換前のひらがな）でも1文字ごとに候補を更新する
            $input.on('input compositionupdate', function () {
                const $self = $(this);
                setTimeout(function () {
                    $self.autocomplete('search', $self.val());
                }, 0);
            });

            // タップしたら一覧を表示
            $input.on('focus click', function () {
                $(this).autocomplete('search', $(this).val());
            });
        }

        $(document).ready(function () {
            setupSuggest('input[name="place"]', PLACE_LIST);
            setupSuggest('input[name="funeral_home"]', FUNERAL_HOME_LIST);
        });
    </script>

    <script>
        let previousClient = '';

        $(document).ready(function () {
            // 「クライアント」チェック状態で選択欄のON/OFFと値の保持・復元
            $('#clientUnknown').change(function () {
                const $clientSelect = $('select[name="client"]');
                if ($(this).is(':checked')) {
                    previousClient = $clientSelect.val();
                    $clientSelect.val('');                 // 表示を空に
                    $clientSelect.prop('disabled', true);
                } else {
                    $clientSelect.prop('disabled', false);
                    $clientSelect.val(previousClient);
                }
            });
        });
    </script>
